name: Monitorar viagens

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitorar-viagens
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Consultar viagens monitoradas
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 120 \
            --output response.json \
            --write-out "%{http_code}" \
            "https://alerta-viagem-pro.vercel.app/api/monitor-trips")

          cat response.json || true
          echo
          echo "HTTP status: $HTTP_STATUS"

          python - "$HTTP_STATUS" <<'PY'
          import json, sys
          from datetime import datetime, timezone

          status = int(sys.argv[1])
          try:
              with open('response.json', encoding='utf-8') as f:
                  body = json.load(f)
          except Exception as exc:
              body = {'ok': False, 'error': f'Resposta inválida: {exc}'}

          diagnostic = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'httpStatus': status,
              'ok': bool(body.get('ok')) and 200 <= status < 300,
              'configured': body.get('configured', True),
              'checked': body.get('checked', 0),
              'alerts': body.get('alerts', 0),
              'errors': body.get('errors', 0),
              'emailEnabled': body.get('emailEnabled', False),
              'skipped': body.get('skipped', False),
              'missing': body.get('missing', []),
              'message': body.get('message') or body.get('error') or 'Execução concluída.'
          }
          with open('monitor-status.json', 'w', encoding='utf-8') as f:
              json.dump(diagnostic, f, ensure_ascii=False, indent=2)

          if not diagnostic['ok']:
              print('::error::Monitoramento não confirmou execução bem-sucedida.')
              sys.exit(1)
          PY

      - name: Salvar diagnóstico
        if: always()
        run: |
          if [ ! -f monitor-status.json ]; then
            printf '{"ok":false,"message":"A execução terminou antes de gerar diagnóstico."}\n' > monitor-status.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Atualiza diagnóstico do monitoramento [skip ci]"
          git push
