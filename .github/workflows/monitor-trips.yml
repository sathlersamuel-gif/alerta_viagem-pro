name: Monitorar viagens

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitorar-viagens
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar configuração do e-mail
        run: |
          set -euo pipefail
          EMAIL_STATUS=$(curl \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 120 \
            --output email-health.json \
            --write-out "%{http_code}" \
            "https://alerta-viagem-pro.vercel.app/api/email-health")

          cat email-health.json || true
          echo
          echo "HTTP e-mail: $EMAIL_STATUS"

          python - "$EMAIL_STATUS" <<'PY'
          import json, sys
          status = int(sys.argv[1])
          with open('email-health.json', encoding='utf-8') as f:
              body = json.load(f)
          if not (200 <= status < 300 and body.get('configured') is True):
              print('::error::O serviço de e-mail não confirmou a RESEND_API_KEY ativa na Vercel.')
              raise SystemExit(1)
          print('E-mail configurado para:', body.get('recipientMasked', 'destinatário configurado'))
          PY

      - name: Consultar viagens monitoradas
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 120 \
            --output response.json \
            --write-out "%{http_code}" \
            "https://alerta-viagem-pro.vercel.app/api/monitor-trips")

          cat response.json || true
          echo
          echo "HTTP monitor: $HTTP_STATUS"

          python - "$HTTP_STATUS" <<'PY'
          import json, sys
          status = int(sys.argv[1])
          with open('response.json', encoding='utf-8') as f:
              body = json.load(f)

          if not (200 <= status < 300 and body.get('ok') is True):
              print('::error::Monitoramento não confirmou execução bem-sucedida.')
              raise SystemExit(1)

          if body.get('skipped'):
              print('Monitor já havia executado dentro do intervalo de 3 horas. Isso não indica falha de e-mail.')
          elif body.get('summarySent') is not True:
              print('::error::A execução ocorreu, mas o relatório obrigatório não foi confirmado como enviado.')
              raise SystemExit(1)
          else:
              print('Relatório obrigatório enviado com sucesso.')
          PY
